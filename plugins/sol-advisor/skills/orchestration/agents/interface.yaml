interface:
  display_name: "Sol Advisor Orchestration"
  short_description: "Default routing: Sol owns critical judgment; native V2 uses a default carrier with logical-role model routing"
  default_prompt: "Route through $sol-advisor:orchestration; keep Sol judgment and use the balanced default-carrier native matrix."
compatibility:
  canonical_format: "codex-plugin-skill"
  adapter_targets:
    - "openai"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "plugin"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "Native V2 is required by default; app-task Luna and legacy Terra/Sol companion roles are explicit compatibility lanes."
