interface:
  display_name: "Sol Advisor Orchestration"
  short_description: "Default routing with worker-preferred commit/push and native Luna V2 engineering delegation"
  default_prompt: "Route through $sol-advisor:orchestration; prefer a scoped worker for authorized commit/push and native Luna V2 engineering."
compatibility:
  canonical_format: "codex-plugin-skill"
  adapter_targets:
    - "openai"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "plugin"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "Native V2 is required by default; app-task Luna and Terra/Sol are explicit compatibility lanes."
