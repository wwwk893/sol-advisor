interface:
  display_name: "Sol Advisor Orchestration"
  short_description: "Default routing for every request; direct primary-only simple lanes and native Luna V2 engineering delegation"
  default_prompt: "Route every request through $orchestration; keep simple lanes primary-only and engineering on native Luna V2."
compatibility:
  canonical_format: "codex-plugin-skill"
  adapter_targets:
    - "openai"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "plugin"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "Native V2 is required by default; app-task Luna and Terra/Sol are explicit compatibility lanes."
