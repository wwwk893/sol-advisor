interface:
  display_name: "Sol Advisor Orchestration"
  short_description: "Default routing: Sol owns critical judgment; native Luna V2 executes decision-complete work"
  default_prompt: "Route through $sol-advisor:orchestration; keep critical judgment in Sol and bounded execution in Luna Max."
compatibility:
  canonical_format: "codex-plugin-skill"
  adapter_targets:
    - "openai"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "plugin"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "Native V2 is required by default; app-task Luna and Terra/Sol are explicit compatibility lanes."
