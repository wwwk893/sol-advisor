interface:
  display_name: "Sol Advisor Orchestration"
  short_description: "0.7.1 exact mixed Sol routing with latency, scope-lock, and terminal-barrier guardrails"
  default_prompt: "Route through $sol-advisor:orchestration 0.7.1 with exact mixed Sol routing and latency guardrails."
compatibility:
  canonical_format: "codex-plugin-skill"
  adapter_targets:
    - "openai"
  activation:
    mode: "manual"
    paths: []
    note: "Manual is adapter invocation metadata only; the global AGENTS default supplies always-on routing."
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "plugin"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "Native V2 is required by default in 0.7.1; compatibility lanes remain explicit opt-ins."
