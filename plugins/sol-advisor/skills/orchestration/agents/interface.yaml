interface:
  display_name: "Sol Advisor Orchestration"
  short_description: "0.7.0 default routing: Sol owns judgment; native Luna V2 runs bounded work under scope locks and terminal barriers"
  default_prompt: "Route through $sol-advisor:orchestration 0.7.0; keep judgment in Sol and bounded work in Luna Max."
compatibility:
  canonical_format: "codex-plugin-skill"
  adapter_targets:
    - "openai"
  activation:
    mode: "manual"
    paths: []
    note: "Manual is adapter invocation metadata only; the global AGENTS default supplies always-on routing."
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "plugin"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "Native V2 is required by default in 0.7.0; app-task Luna and Terra/Sol are explicit compatibility lanes."
